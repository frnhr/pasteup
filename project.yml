name: Pasteup

options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 3.1.0
  PasteupCore:
    path: Packages/PasteupCore

targets:
  Pasteup:
    type: application
    platform: macOS
    sources:
      - path: Pasteup
    dependencies:
      - package: KeyboardShortcuts
      - package: PasteupCore
    info:
      path: Pasteup/Info.plist
      properties:
        CFBundleName: Pasteup
        CFBundleDisplayName: Pasteup
        CFBundleShortVersionString: "0.2.1"
        CFBundleVersion: "3"
        NSHumanReadableCopyright: © 2026 Fran Hrženjak
        LSUIElement: true
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.productivity
    settings:
      base:
        PRODUCT_NAME: Pasteup
        PRODUCT_MODULE_NAME: Pasteup
        PRODUCT_BUNDLE_IDENTIFIER: com.franhrzenjak.pasteup
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
    scheme: {}
